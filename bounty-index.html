<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="qrcode.min.js"></script><script src="seeds.js"></script><script src="sim-shim.js"></script><script src="i18n-dict.js"></script><script src="i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>官方悬赏 · 挑战你的智慧，真实改变世界</title>
<style>
:root{--bg:#050912;--card:#0d1730;--line:rgba(255,255,255,.12);--gold:#f2c14e;--dim:#b8c4d8;--faint:#7d8ba5;--blue:#7fb2ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 15% -10%,rgba(109,141,255,.18),transparent 55%),radial-gradient(900px 500px at 90% 10%,rgba(242,193,78,.1),transparent 50%),var(--bg);color:#f2f5fb;font:22px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:0 16px 70px;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-top:54px}
.exit{position:fixed;top:14px;right:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(4,8,16,.86);color:#fff;font-size:23px;cursor:pointer;backdrop-filter:blur(8px)}
.exit:hover{border-color:var(--gold);color:#ffe3a6}
.kicker{font-size:11px;letter-spacing:.32em;color:var(--gold);text-align:center}
h1{font-family:"Songti SC","STSong",serif;font-size:clamp(32px,6vw,58px);line-height:1.25;letter-spacing:.06em;text-align:center;margin:12px auto 10px;max-width:900px;background:linear-gradient(120deg,#ffe8b0,#f2c14e 55%,#fff1c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--dim);font-size:22px;max-width:760px;margin:0 auto 26px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 28px}
.btn{border:1px solid var(--line);border-radius:999px;padding:11px 20px;background:rgba(255,255,255,.04);color:#f2f5fb;text-decoration:none;font-size:19px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:rgba(242,193,78,.65);color:#fff}
.btn.pri{background:linear-gradient(120deg,#f2c14e,#ffd97a);color:#1a1405;border-color:#f2c14e;font-weight:800}
.list{display:grid;gap:14px}
.item{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(16,25,46,.96),rgba(7,12,24,.96));padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.25);cursor:pointer;transition:.2s;display:flex;gap:18px;align-items:flex-start}
.item:hover{transform:translateY(-2px);border-color:rgba(242,193,78,.45)}
.item-h{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.item-main{flex:1;min-width:0}.item-thumb{width:190px;height:140px;flex:0 0 auto;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#050a14;cursor:zoom-in;display:flex;align-items:center;justify-content:center;font-size:34px;color:#7d8ba5}.item-thumb img{width:100%;height:100%;object-fit:cover;display:block}.item-h b{font-family:"Songti SC",serif;font-size:31px;color:#f7e7c6}
.item-h span{font-size:16px;color:var(--faint);white-space:nowrap}
.reward{display:inline-block;border:1px solid rgba(242,193,78,.42);border-radius:999px;padding:5px 13px;font-size:18px;color:#ffe3a6;margin-top:8px}
.item p{font-size:20px;line-height:1.9;color:var(--dim);margin:9px 0 0;white-space:pre-wrap}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:16px;color:var(--faint);margin-top:10px}
.empty{border:1px dashed rgba(255,255,255,.18);border-radius:14px;padding:38px;text-align:center;color:var(--faint);line-height:2;font-size:20px}
.detail{border:1px solid rgba(242,193,78,.35);border-radius:16px;background:linear-gradient(180deg,#101a30,#070c18);padding:22px;margin-top:10px}
.detail h2{font-family:"Songti SC",serif;font-size:clamp(24px,4vw,34px);margin:8px 0 6px;color:#f7e7c6}
.detail p{font-size:21px;line-height:2;color:var(--dim);white-space:pre-wrap}
.media{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.media img,.media video{width:180px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}
.attach{display:flex;flex-direction:column;gap:7px;margin-top:14px;font-size:19px}.attach a{color:#9fd0ff;text-decoration:underline}
.note{font-size:16px;color:var(--faint);text-align:center;margin-top:28px}
.viewer{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(2,5,10,.95);padding:22px}.viewer.show{display:flex}.viewer img,.viewer video{max-width:94vw;max-height:86vh;border-radius:8px;box-shadow:0 30px 100px rgba(0,0,0,.7);background:#000}.viewer-close{position:absolute;top:16px;right:18px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(5,9,18,.9);color:#fff;font-size:24px;cursor:pointer}
@media(max-width:640px){.wrap{padding-top:48px}.item{flex-direction:column}.item-thumb{width:100%;height:190px}.item-h{display:block}.item-h span{display:block;margin-top:4px}.item{padding:15px}.media img,.media video{width:100%;height:170px}}
</style>
<script src="assets-tc-page.js" defer></script>
</head>
<body>
<button class="exit" type="button" onclick="location.href='index.html'" title="退出，回主站" aria-label="退出，回主站">✕</button>
<div class="wrap">
  <div class="kicker">GENESIS · OFFICIAL BOUNTY</div>
  <h1>挑战你的智慧，真实改变世界</h1>
  <div class="sub">这些不是虚构的作业，是真实生活里等着被解决的问题。<br>选一个你能解决的，做出原型，再回来交给你自己的答案。</div>
  <div class="actions">
    <a class="btn" href="icc-index.html">← 返回 FXM 模拟评审</a>
    <a class="btn" href="index.html">回主站</a>
  </div>
  <div id="list" class="list"><div class="empty">正在打开官方悬赏……</div></div>
  <div class="note">官方悬赏由发小明学院发布；学生作品与解决进度请在自己的「我的实验室」里留存。</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let BOUNTIES=[];
async function load(){
  try{
    const r=await fetch('/api/bounties'); const d=await r.json();
    BOUNTIES=(d&&d.bounties)||[]; render();
  }catch(e){ $('#list').innerHTML='<div class="empty">加载失败，请稍后再试。</div>'; }
}
function render(){
  if(!BOUNTIES.length){ $('#list').innerHTML='<div class="empty">官方悬赏正在准备中。<br>你可以先去 FXM 提出一个真实问题。</div>'; return; }
  $('#list').innerHTML=BOUNTIES.map(b=>{
    const first=(b.images||[])[0];
    const thumb=first
      ? '<div class="item-thumb" onclick="event.stopPropagation();viewMedia(\''+esc(first.url)+'\',\'image\')"><img src="'+esc(first.url)+'" alt="'+esc(b.title)+'" loading="lazy"></div>'
      : '<div class="item-thumb">🎯</div>';
    return '<div class="item" onclick="detail(\''+b.id+'\')">'+thumb+'<div class="item-main"><div class="item-h"><b>'+esc(b.title)+'</b><span>'+(b.deadline?('截止 '+esc(b.deadline)):'长期有效')+'</span></div>'+
      '<div class="reward">🎁 '+esc(b.reward||'官方奖励')+'</div>'+
      '<p>'+esc(b.summary||b.description||'')+'</p>'+
      '<div class="meta"><span>发布：'+esc(b.sponsor||'发小明官方')+'</span><span>点击查看课题说明与附件 →</span></div></div></div>';
  }).join('');
}
async function detail(id){
  try{
    const r=await fetch('/api/bounties/'+encodeURIComponent(id)); const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||'悬赏不存在');
    const b=d.bounty;
    const imgs=(b.images||[]).map(m=>'<img src="'+esc(m.url)+'" alt="" style="cursor:zoom-in" onclick="viewMedia(\''+esc(m.url)+'\',\'image\')">').join('');
    const atts=(b.attachments||[]).map(a=>'<a href="'+esc(a.url)+'" download>'+esc(a.name||'附件')+'</a>').join('');
    $('#list').innerHTML='<div class="actions" style="justify-content:flex-start"><button class="btn" onclick="render()">← 返回悬赏列表</button></div>'+
      '<div class="detail"><div class="kicker">OFFICIAL BOUNTY</div><h2>'+esc(b.title)+'</h2>'+
      '<div class="reward">🎁 '+esc(b.reward||'官方奖励')+'</div>'+
      '<p>'+esc(b.description||b.summary||'')+'</p>'+
      (b.video?'<video src="'+esc(b.video)+'" controls style="width:100%;max-height:380px;margin-top:14px;border-radius:8px"></video>':'')+
      (imgs?'<div class="media">'+imgs+'</div>':'')+
      (atts?'<div class="attach"><b style="color:#9aa6bd;font-size:12px">附件下载</b>'+atts+'</div>':'')+
      '<div class="meta"><span>发布：'+esc(b.sponsor||'发小明官方')+'</span>'+(b.deadline?'<span>截止 '+esc(b.deadline)+'</span>':'')+'</div>'+
      '<div class="actions" style="justify-content:flex-start"><button class="btn pri" onclick="solve(\''+b.id+'\')">🎯 我要解决这个真实问题</button></div></div>';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){ $('#list').innerHTML='<div class="empty">'+esc(e.message||'悬赏不存在')+'</div>'; }
}
function viewMedia(url,kind){
  const box=document.getElementById('viewerBody'); if(!box) return;
  box.innerHTML=kind==='video'?'<video src="'+esc(url)+'" controls autoplay playsinline></video>':'<img src="'+esc(url)+'" alt="大图">';
  document.getElementById('viewer').classList.add('show');
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('viewerBody').innerHTML='';
}
function solve(id){
  const b=BOUNTIES.find(x=>x.id===id); if(!b){ load(); return; }
  try{ localStorage.setItem('fxm_course_lab_v1',JSON.stringify([{product:b.title,problem:b.summary||b.description||'',how:'',source:'bounty'}])); }catch(e){}
  location.href='index.html?scene=inspire';
}
load();
</script>
<div class="viewer" id="viewer" onclick="if(event.target===this)closeViewer()"><button class="viewer-close" type="button" onclick="closeViewer()" aria-label="关闭大图">✕</button><div id="viewerBody"></div></div>
</body>
</html>
