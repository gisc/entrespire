<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="带灯螺丝刀的三个可能位置：手柄尾部、批头旁边、电池仓">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d141e"/><stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7ba"/><stop offset=".45" stop-color="#5d6b7f"/><stop offset="1" stop-color="#394555"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313e50"/><stop offset=".5" stop-color="#202b3a"/><stop offset="1" stop-color="#151d28"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e6c766" stop-opacity=".18"/><stop offset="1" stop-color="#e6c766" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1c2635" stroke-width="1" opacity=".55"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#grid)"/>
  <ellipse cx="470" cy="275" rx="430" ry="190" fill="url(#glow)"/>

  <!-- 工作面板与螺丝 -->
  <rect x="0" y="120" width="168" height="300" fill="#0a0f16" stroke="#202b3a"/>
  <rect x="20" y="160" width="128" height="220" rx="4" fill="#101823" stroke="#253141"/>
  <path d="M46 170v200M70 170v200M94 170v200M118 170v200" stroke="#1b2432" stroke-width="1"/>
  <g>
    <ellipse cx="153" cy="272" rx="26" ry="34" fill="#0c121a" stroke="#2a3547"/>
    <circle cx="153" cy="272" r="19" fill="#1a2330" stroke="#46536a"/>
    <path d="M143 262l20 20M163 262l-20 20" stroke="#0a0f16" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M137 250c8-5 24-5 32 0" stroke="#5d6b7f" stroke-width="1.4" fill="none" opacity=".8"/>
  </g>

  <!-- 批头与轴 -->
  <path d="M205 260l38-3v31l-38-3z" fill="url(#metal)"/>
  <path d="M205 260l22 2v27l-22 2z" fill="#c3ccda" opacity=".55"/>
  <rect x="238" y="262" width="298" height="26" rx="4" fill="url(#metal)"/>
  <path d="M250 264h274" stroke="#cdd6e2" stroke-width="2" opacity=".32"/>
  <rect x="524" y="252" width="34" height="46" rx="6" fill="#3c4a5d" stroke="#5d6b7f"/>

  <!-- 手柄 -->
  <path d="M552 236c26-12 62-18 108-18h150c32 0 52 18 52 44v16c0 26-20 44-52 44H660c-46 0-82-6-108-18-14-7-22-20-22-34s8-27 22-34z" fill="url(#grip)" stroke="#46536a"/>
  <g stroke="#2f3c4e" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M600 240v60"/><path d="M624 236v68"/><path d="M648 234v72"/><path d="M672 233v74"/>
  </g>
  <rect x="812" y="238" width="18" height="74" rx="9" fill="#3c4a5d" stroke="#5d6b7f"/>

  <!-- 电池仓（虚线） -->
  <rect x="694" y="248" width="104" height="54" rx="8" fill="none" stroke="#5d6b7f" stroke-dasharray="5 5" opacity=".8"/>
  <g fill="#7b889c" opacity=".8">
    <rect x="704" y="262" width="38" height="24" rx="4"/><rect x="750" y="262" width="38" height="24" rx="4"/>
  </g>
  <path d="M708 262v-5h6v5M754 262v-5h6v5" fill="none" stroke="#9aa7ba" stroke-width="3"/>

  <!-- 三个位置 -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle">
    <g>
      <circle cx="850" cy="122" r="30" fill="#0b1018" stroke="#8d97aa" stroke-width="2"/>
      <text x="850" y="133" fill="#c9d2e0">A</text>
      <path d="M850 152v72" stroke="#8d97aa" stroke-width="1.6" stroke-dasharray="4 5"/>
      <circle cx="850" cy="232" r="5" fill="#8d97aa"/>
    </g>
    <g>
      <circle cx="262" cy="398" r="30" fill="#0b1018" stroke="#d89a3c" stroke-width="2"/>
      <text x="262" y="409" fill="#efcb94">B</text>
      <path d="M262 368v-58" stroke="#d89a3c" stroke-width="1.6" stroke-dasharray="4 5"/>
      <circle cx="262" cy="302" r="5" fill="#d89a3c"/>
    </g>
    <g>
      <circle cx="746" cy="398" r="30" fill="#0b1018" stroke="#8d97aa" stroke-width="2"/>
      <text x="746" y="409" fill="#c9d2e0">C</text>
      <path d="M746 368v-52" stroke="#8d97aa" stroke-width="1.6" stroke-dasharray="4 5"/>
      <circle cx="746" cy="308" r="5" fill="#8d97aa"/>
    </g>
  </g>

  <g font-family="PingFang SC,Noto Sans SC,sans-serif" font-size="18" fill="#5a6679">
    <text x="46" y="472">工作点：暗处的螺丝</text>
    <text x="640" y="472">三个候选位置，只能选一个</text>
  </g>
</svg>
