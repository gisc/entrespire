<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="qrcode.min.js"></script><script src="seeds.js"></script><script src="sim-shim.js"></script><script src="i18n-dict.js"></script><script src="i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>先点亮自己 · 发小明教师特训营</title>
<meta name="theme-color" content="#050914">
<link rel="stylesheet" href="teacher-training-styles.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="aura" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="../" title="返回教师工作台">
    <span class="brand-mark">✦</span>
    <span class="brand-text">发小明 · 教师特训营<small>TEACHER ACADEMY</small></span>
  </a>
  <div class="crumb"><b id="crumbNum">00</b><span id="crumbTitle">点亮</span></div>
  <div class="progress" aria-hidden="true"><i id="pbar"></i></div>
  <div class="tools">
    <button class="tool" id="btnAgenda" type="button" title="2 天 1 夜议程">议程</button>
    <button class="tool" id="btnNotes" type="button" title="讲师提示">讲师模式</button>
    <button class="tool" id="btnKit" type="button" title="下载附件与图表">附件</button>
    <button class="tool" id="btnFull" type="button" title="全屏 (F)">全屏</button>
    <button class="tool primary" id="btnMenu" type="button" title="目录 (M)">目录</button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="航段导航"></nav>

<main id="stage" aria-live="polite"></main>

<footer class="bottombar">
  <button class="navbtn" id="btnPrev" type="button" aria-label="上一幕">←</button>
  <div class="sceneinfo"><span id="sceneCounter">01 / 04</span><span id="sceneKicker">TEACHER ACADEMY</span></div>
  <button class="navbtn next" id="btnNext" type="button">下一幕 <b>→</b></button>
</footer>

<aside class="drawer" id="notesDrawer" aria-hidden="true">
  <div class="drawer-head"><div><b>讲师提示</b><span id="notesTime">20 分钟</span></div><button id="btnNotesClose" type="button">×</button></div>
  <div class="drawer-body" id="notesBody"></div>
  <div class="drawer-foot">按 <kbd>N</kbd> 开关 · 按 <kbd>→</kbd> 下一幕 · 按 <kbd>F</kbd> 全屏</div>
</aside>

<div class="overlay" id="menuOverlay" aria-hidden="true">
  <div class="panel menu-panel">
    <div class="panel-head"><div><span class="kicker">CONTENTS</span><h2>十个航段</h2></div><button class="close" data-close="menuOverlay" type="button">×</button></div>
    <div class="menu-list" id="menuList"></div>
    <div class="panel-foot"><span>进度自动保存在本机 · 可随时回来复习</span><button class="btn ghost" id="btnReset" type="button">清除进度</button></div>
  </div>
</div>

<div class="overlay" id="kitOverlay" aria-hidden="true">
  <div class="panel kit-panel">
    <div class="panel-head"><div><span class="kicker">TOOLKIT</span><h2>带走这些图表和工具</h2></div><button class="close" data-close="kitOverlay" type="button">×</button></div>
    <div class="kit-grid" id="kitGrid"></div>
    <div class="panel-foot"><span>全部 PDF 可打印 · 建议 A4 双面</span><a class="btn ghost" href="../" target="_blank">返回教师工作台 ↗</a></div>
  </div>
</div>

<div class="overlay" id="agendaOverlay" aria-hidden="true">
  <div class="panel agenda-panel">
    <div class="panel-head"><div><span class="kicker">2 天 1 夜 · 17 小时</span><h2>培训议程</h2></div><button class="close" data-close="agendaOverlay" type="button">×</button></div>
    <div class="agenda-grid" id="agendaGrid"></div>
    <div class="panel-foot"><span>净教学 17 小时 · 午餐/晚餐各 1 小时 · 第二天 18:00 结束</span></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="teacher-training-lessons.js"></script>
<script src="teacher-training-schedule.js"></script>
<script src="teacher-training-data.js"></script>
<script src="teacher-training-app.js"></script>
</body>
</html>
